<html>
<head>
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="assets/css/launcher.css">
    <!-- build:js -->
    <script src="assets/js/vendor.js"></script>
    <script src="assets/js/launcher.js"></script>
    <script src="assets/js/launcher_templates.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <meta charset="UTF-8">
    <!-- endbuild -->
    <title>
        Minecraft Launcher
    </title>
    <!-- <link rel="stylesheet" type="text/css" href="assets/css/style.css"> -->
</head>
<body ng-controller="ApplicationController as appCtrl" ng-class="appCtrl.getReadDirection()">
    <div id="overlay-loading" ng-hide="appCtrl.loaded">
        <div id="overlay-loading-content">
            Loading
        </div>
    </div>
    <div id="upper" ng-class="{'upper-small' : !appCtrl.isLargeBottomBar()}">
        <mc-overlay></mc-overlay>
        <mc-topmenu></mc-topmenu>
        <mc-status></mc-status>
        <div id="container">
            <!-- <div id="container-center"> -->
                <!-- <h1>Log command: {{appCtrl.logCommand}}</h1> -->
                <div ui-view></div>
            <!-- </div> -->
        </div>
    </div>
    <mc-game-starter></mc-game-starter>
    <!-- <mc-status></mc-status> -->
    <!-- <div id="inset-shadow"></div> -->
</body>
</html>
